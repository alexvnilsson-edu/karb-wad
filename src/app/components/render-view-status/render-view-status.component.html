<div class="grid grid-cols-6 bg-gray-800 font-mono text-white p-2 gap-2 divide-gray-600 divide-x-1 divide-dashed" id="status">
    <div class="px-2">
        <span>{{ coord().x }}</span>
        <span>, </span>
        <span>{{ coord().y }}</span>
    </div>

    <div id="origin">
        <label>Origo: </label>
        <span id="rendererStatusOriginX">0</span>
        <span>, </span>
        <span id="rendererStatusOriginY">0</span>
    </div>
</div>
