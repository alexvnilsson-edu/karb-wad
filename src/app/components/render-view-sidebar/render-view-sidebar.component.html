<div class="p-2 text-white">
    <h4 class="text-lg">Elements</h4>
    <div class="flex flex-col gap-1 overflow-y-scroll scroll-smooth">
        @for (element of elements(); track element.id) {
            <div class="p-2 bg-gray-200 text-black rounded-md font-mono">
                <p><strong>ID:</strong>&nbsp;<span class="text-sm">{{ element.id }}</span></p>
                <p><strong>Type: </strong> <span>{{ element.type }}</span></p>
            </div>
        }
    </div>
</div>
