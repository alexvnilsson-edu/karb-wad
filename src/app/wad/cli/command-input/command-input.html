<div class="flex flex-col justify-stretch items-stretch flex-1 p-1 bg-gray-800 border-gray-600 border-2 rounded-lg">
    @if (error$()) {
        <p class="p-2 mb-2 text-red-200">
            {{ errorMessage$() }}
        </p>
    }

    <input
        type="text"
        class="flex-1 bg-gray-900 text-white text-xl p-1 px-2"
        spellcheck="false"
        [(ngModel)]="command"
        (keyup.enter)="enter()"
        (focus)="focus($event)"
        (blur)="blur($event)"
    />
</div>
