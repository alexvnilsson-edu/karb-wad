<div class="command-input-container">
  <div class="command-input-container-inner">
    @if (isActive()) {
      <app-wad-command-log />
    }

    <input
      #wadCommandInput
      type="text"
      class="command-input-text"
      [attr.placeholder]="inputPlaceholder$()"
      spellcheck="false"
      [(ngModel)]="command"
      (keyup.enter)="onEnterKeyup()"
      (keyup.escape)="onEscapeKeyup()"
      (input)="onInput()"
      (focus)="onFocus($event)"
    />
  </div>
</div>
