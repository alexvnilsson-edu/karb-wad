<div class="command-input-container mx-auto w-xl lg:w-lg flex justify-center">
  <div
    class="flex flex-col justify-stretch items-stretch flex-1 p-1 px-2 bg-gray-900 border-gray-600 border-2 rounded-lg font-mono text-white"
  >
    @if (isActive$()) {
      <wad-command-log />
    }

    <input
      #commandInput
      type="text"
      class="command-input-text flex-1 p-1"
      [attr.placeholder]="inputPlaceholder$()"
      spellcheck="false"
      [(ngModel)]="command"
      (keyup.enter)="onEnterKeyup()"
      (keyup.escape)="onEscapeKeyup()"
      (input)="onInput()"
      (focus)="onFocus($event)"
    />
  </div>
</div>
