@if (messages() && messages().length > 0) {
  <div class="command-log-container">
    @if (messages().length > lookBack()) {
      <p class="disabled">...</p>
    }
    @for (message of messages() | slice: -lookBack(); track message.id) {
      <p [ngClass]="getMessageLevelClass(message)">{{ message.message }}</p>
    }
  </div>
}
