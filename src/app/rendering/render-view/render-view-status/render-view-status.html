<div
  class="grid grid-cols-4 bg-gray-800 font-mono text-white p-2 gap-2 border-t-1 border-t-gray-600 divide-gray-600 divide-x-1 divide-dashed"
>
  <div i18n-aria-label aria-label="Mouse Coordinates" class="px-2">
    @if (coords() && coords()[0] && coords()[1]) {
      <span>{{ coords()[0] | number: '1.0-1' }}..{{ coords()[1] | number: '1.0-1' }}</span>
    }
  </div>

  <div i18n-aria-label aria-label="Scale" class="px-2">
    <span i18n>Scale:</span>
    @if (scale()) {
      <span>{{ scale() | percent }}</span>
    }
  </div>
</div>
