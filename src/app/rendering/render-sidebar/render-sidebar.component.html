<div class="flex flex-col p-2 text-white">
  <h4 class="text-lg">Elements</h4>
  <div class="flex-1 flex flex-col gap-1 overflow-y-auto scroll-smooth">
    @for (entry of elements(); track entry[0]) {
      @let element = entry[1];
      <div class="flex-1 p-2 bg-gray-200 text-black rounded-md font-mono">
        <p>
          <strong>ID:</strong>&nbsp;<span class="text-sm">{{ element.id }}</span>
        </p>
        <p>
          <strong>Type: </strong> <span>{{ element.type }}</span>
        </p>

        @if (element.isFocused) {
          <p><i>Focused</i></p>
        }
      </div>
    }
  </div>
</div>
