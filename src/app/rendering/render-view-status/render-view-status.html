<div
  class="grid grid-cols-4 bg-gray-800 font-mono text-white p-2 gap-2 border-t-1 border-t-gray-600 divide-gray-600 divide-x-1 divide-dashed"
>
  <div aria-label="Mouse Coordinates" class="px-2">
    <span>{{ coords()[0] | DecimalPipe }}</span>
  </div>

  <div aria-label="Mouse Coordinates" class="px-2">
    <span>Scale: </span>
    <span>{{ scale$() }}</span>
  </div>

  <div aria-label="Origo Coordinates">
    <span>Origo: </span>
    <span>{{ origin$() }}</span>
  </div>
</div>
